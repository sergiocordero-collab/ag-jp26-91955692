<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="flypod" content="none">
<title>Audioguía Japón 26</title>
<meta name="theme-color" content="#12141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audioguía JP">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="row">
    <select id="day" aria-label="Día"></select>
    <button id="nearBtn" class="pill">📍 Cerca de mí</button>
  </div>
  <div class="row tabs">
    <button id="tabList" class="tab on">☰ Lista</button>
    <button id="tabMap" class="tab">🗺️ Mapa</button>
    <button id="dlBtn" class="pill small">⬇︎ Descargar día</button>
  </div>
  <div id="dayInfo" class="muted"></div>
</header>
<div id="banner" hidden></div>
<main>
  <section id="list"></section>
  <section id="mapWrap" hidden><div id="map"></div></section>
</main>
<footer id="player" hidden>
  <div id="pTitle"></div>
  <audio id="audio" controls preload="none" playsinline></audio>
</footer>
<script src="leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
